<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sidekick has moved — sidekick.stepuptutoring.org</title>

  <!-- Canonical target. Keep these three in sync if the destination ever changes. -->
  <link rel="canonical" href="https://sidekick.stepuptutoring.org/" />
  <meta http-equiv="refresh" content="0; url=https://sidekick.stepuptutoring.org/" />
  <meta name="robots" content="noindex, follow" />

  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      padding: 24px;
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fbf8f2; color: #1f1f1f;
      text-align: center;
    }
    a { color: #0b7a80; }
    @media (prefers-color-scheme: dark) {
      body { background: #14100c; color: #f2efe8; }
      a { color: #4fc9d0; }
    }
  </style>
</head>
<body>
  <main>
    <p>Sidekick now lives at <a href="https://sidekick.stepuptutoring.org/">sidekick.stepuptutoring.org</a>.</p>
    <p>Redirecting you now — if nothing happens, use the link above.</p>
  </main>
  <script>
    // replace() rather than assign() so the dead URL doesn't sit in history and
    // trap the back button. Runs after the visible fallback is already painted.
    location.replace("https://sidekick.stepuptutoring.org/" + location.hash);
  </script>
</body>
</html>
